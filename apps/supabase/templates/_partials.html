<!--
  The two blocks every message shares, kept in one file for the reason the
  layout is one file.

  `pnpm email:build` splices these in wherever a body writes
  `<!--PARTIAL:name-->`, or `<!--PARTIAL:name|first arg|second arg-->` where the
  block takes text. Inside a block, `$1` and `$2` are those arguments.

  Blocks are separated by the `PARTIAL name` markers below and nothing else, so
  adding one is two lines.
-->

<!-- PARTIAL code -->
<!--
  THE CODE COMES FIRST, AND THE LINK SECOND, IN EVERY ONE OF THESE.

  Not a house style. Corporate mail security (Microsoft Defender's Safe Links,
  most enterprise gateways) FETCHES every link in an incoming message to check
  it, and a Supabase confirmation link is spent on first use — so by the time
  the reader taps it they get "Token has expired or is invalid" for a mail that
  arrived ten seconds ago. Supabase's own docs name this and the way out is the
  one below: put `{{ .Token }}` in the mail and verify it in the app. A code
  cannot be consumed by something reading the mail.

  It is also the only half that works when the mail is opened on a DIFFERENT
  device from the one the app is on, which on a phone app is common.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td
      align="center"
      class="rc-code"
      style="padding: 18px 12px; background-color: #eaf9f0; border: 1px solid #cfebda; border-radius: 6px; font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 34px; font-weight: 700; line-height: 40px; letter-spacing: 8px; color: #1b8a4e;"
    >
      {{ .Token }}
    </td>
  </tr>
</table>
<!-- /PARTIAL -->

<!-- PARTIAL button -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin: 0 auto;">
  <tr>
    <td
      class="rc-button"
      align="center"
      style="background-color: #1b8a4e; border-radius: 6px;"
    >
      <a
        href="{{ .ConfirmationURL }}"
        class="rc-button"
        style="display: inline-block; padding: 13px 28px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; line-height: 20px; color: #ffffff; text-decoration: none; border-radius: 6px;"
        >$1</a
      >
    </td>
  </tr>
</table>
<!-- /PARTIAL -->

<!-- PARTIAL rule -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td
      class="rc-rule"
      style="padding: 0; border-top: 1px solid #e6e8eb; font-size: 0; line-height: 0;"
    >
      &nbsp;
    </td>
  </tr>
</table>
<!-- /PARTIAL -->
