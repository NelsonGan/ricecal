<!--
key: email_change
subject: {{ .Token }} is your RiceCal code
preheader: Confirm the change of email address on your account.
-->

<!--
  SENT TO BOTH ADDRESSES, because `mailer_secure_email_change_enabled` is on:
  the old one has to agree and the new one has to prove it exists. So the copy
  names the new address rather than saying "your email", or the mail landing in
  the OLD inbox reads as though the change has already happened.
-->

<h1 class="rc-fg" style="margin: 0 0 14px 0; font-family: 'Baloo 2', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 800; line-height: 33px; color: #1b3a2b;">
  Confirm your new email address
</h1>

<p class="rc-copy" style="margin: 0 0 24px 0; font-size: 16px; line-height: 26px; color: #495450;">
  Your account is moving from {{ .Email }} to {{ .NewEmail }}. Both addresses get
  a code, and the change needs both.
</p>

<!--PARTIAL:code-->

<p class="rc-muted" style="margin: 20px 0 0 0; font-size: 14px; line-height: 22px; font-weight: 700; color: #6e7b74;">
  Expires in an hour, and works once.
</p>

<div style="height: 28px; line-height: 28px;">&nbsp;</div>
<!--PARTIAL:rule-->
<div style="height: 24px; line-height: 24px;">&nbsp;</div>


<!--PARTIAL:button|Confirm new address-->

<p class="rc-muted" style="margin: 24px 0 0 0; font-size: 13px; line-height: 20px; font-weight: 700; color: #6e7b74;">
  Not you? Ignore this email and the change cannot go through.
</p>
