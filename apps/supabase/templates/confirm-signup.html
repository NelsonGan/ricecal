key: confirmation
subject: {{ .Token }} is your RiceCal code
preheader: Your code to finish signing up.
-->

<!--
  THE CODE IS IN THE SUBJECT LINE, and that is the one piece of copy here worth
  arguing about. It means the reader can finish signing up from the notification
  banner without opening anything, which on a phone is the difference between
  one gesture and four. The cost is that the code is visible on a locked screen;
  it is worth an hour, it is bound to one address, and the alternative is a
  person switching apps twice with a six digit number in their head.
-->

<h1 class="rc-fg" style="margin: 0 0 14px 0; font-family: 'Baloo 2', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 800; line-height: 33px; color: #1b3a2b;">
  Confirm your email address
</h1>

<p class="rc-copy" style="margin: 0 0 24px 0; font-size: 16px; line-height: 26px; color: #495450;">
  Enter this code in RiceCal to finish setting up your account.
</p>

<!--PARTIAL:code-->

<p class="rc-muted" style="margin: 20px 0 0 0; font-size: 14px; line-height: 22px; font-weight: 700; color: #6e7b74;">
  Expires in an hour, and works once.
</p>

<div style="height: 28px; line-height: 28px;">&nbsp;</div>
<!--PARTIAL:rule-->
<div style="height: 24px; line-height: 24px;">&nbsp;</div>
