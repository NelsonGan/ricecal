<!--
key: password_changed_notification
subject: Your RiceCal password was changed
preheader: A confirmation, in case it was not you.
-->

<!--
  A NOTIFICATION, not a request. There is no code and no button, because there
  is nothing for the reader to do unless it was not them, and a security mail
  with an action button in it is the shape every phishing mail wears.

  It is enabled at the project level (`mailer_notifications_password_changed_enabled`),
  and it is the one thing that turns a stolen password into something the owner
  finds out about the same minute.
-->

<h1 class="rc-fg" style="margin: 0 0 14px 0; font-family: 'Baloo 2', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 800; line-height: 33px; color: #1b3a2b;">
  Your password was changed
</h1>

<p class="rc-copy" style="margin: 0 0 20px 0; font-size: 16px; line-height: 26px; color: #495450;">
  The password on the RiceCal account for {{ .Email }} was changed just now. If
  that was you, there is nothing to do.
</p>

<p class="rc-copy" style="margin: 0; font-size: 16px; line-height: 26px; color: #495450;">
  If it was not you, open RiceCal, tap "Forgot your password" and reset it. That
  signs out everywhere. Then write to us at
  <a class="rc-brand" href="mailto:hello@ricecal.app" style="color: #1b8a4e; text-decoration: underline;">hello@ricecal.app</a>.
</p>
