<!--
key: email_changed_notification
subject: Your RiceCal email address was changed
preheader: A confirmation, in case it was not you.
-->

<h1 class="rc-fg" style="margin: 0 0 14px 0; font-family: 'Baloo 2', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 800; line-height: 33px; color: #1b3a2b;">
  Your email address was changed
</h1>

<p class="rc-copy" style="margin: 0 0 20px 0; font-size: 16px; line-height: 26px; color: #495450;">
  The RiceCal account that used {{ .OldEmail }} now uses {{ .Email }}. If that
  was you, there is nothing to do.
</p>

<p class="rc-copy" style="margin: 0; font-size: 16px; line-height: 26px; color: #495450;">
  If it was not you, write to us at
  <a class="rc-brand" href="mailto:hello@ricecal.app" style="color: #1b8a4e; text-decoration: underline;">hello@ricecal.app</a>
  straight away. This address can no longer sign in to that account, so we have
  to move it back for you.
</p>
