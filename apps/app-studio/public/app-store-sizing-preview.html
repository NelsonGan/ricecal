<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>RiceCal App Store sizing</title>
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#f7f8f7;color:#1b3a2b;font:14px system-ui}main{display:flex;gap:36px;align-items:flex-start;width:810px}section{flex:none}h1{font-size:16px;margin:0 0 12px}p{color:#66766c;font-size:12px;margin:12px 0}.header{width:393px;height:258px;position:relative;overflow:hidden;background:linear-gradient(#efdfc7,#fef9eb 90px);border-radius:32px 32px 0 0}.header>img{position:absolute;bottom:0;left:0;width:100%;height:auto;mask-image:linear-gradient(transparent,black 24px)}.island{position:absolute;top:10px;left:132px;width:128px;height:36px;background:#1d1e1b;border-radius:30px}.nav{position:absolute;top:61px;width:48px;height:48px;border:0;border-radius:50%;background:#fff9;display:grid;place-items:center;font-size:28px;box-shadow:0 1px 10px #0001}.back{left:14px}.share{right:14px;font-size:23px}.info{display:flex;gap:14px;padding:20px 16px;background:white;width:393px;border-radius:0 0 22px 22px}.icon{width:66px;height:66px;border-radius:16px}.name{font-size:18px;color:#111;font-weight:600;max-width:220px}.sub{font-size:12px;color:#888;margin-top:5px}.get{margin-top:9px;border-radius:22px;background:#2785ff;color:#fff;width:55px;padding:4px 0;text-align:center;font-size:13px}.search{width:353px;border-radius:12px;display:block}.listing{display:flex;gap:12px;align-items:center;width:353px;padding:8px 0 16px}.listing .icon{width:46px;height:46px;border-radius:11px}.listing .name{font-size:14px}.listing .sub{font-size:11px}.listing .get{margin:0 0 0 auto;background:#efefef;color:#2785ff;flex:none}.description{max-width:393px}</style>

</html>
