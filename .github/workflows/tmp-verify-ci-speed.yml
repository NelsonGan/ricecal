# TEMPORARY: removed before this pull request merges. It runs the store build's
# setup steps (which only ever run on main) so the EAS CLI cache can be seen
# working on both runner images without building or submitting anything.
name: tmp verify CI speed

on:
  pull_request:
    paths: ['.github/workflows/tmp-verify-ci-speed.yml']

permissions:
  contents: read

jobs:
  eas-cli:
    name: EAS CLI cache (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, xcode-27]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            apps/mobile
            patches
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up EAS CLI
        uses: expo/expo-github-action@9da89d3617bb88139671bad31b09c65714c2ee06 # 9.0.1
        with:
          eas-version: 27.5.0
          token: ${{ secrets.EXPO_TOKEN }}
      - run: eas --version
      - name: Cache paths the store build names
        run: |
          ls -d ~/.gradle 2>/dev/null || echo "no ~/.gradle yet"
          ls -d ~/Library/Caches 2>/dev/null || true
