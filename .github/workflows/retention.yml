# A free account's meal photographs are kept for thirty days. This is the clock
# that says so.
#
# The sweep itself is `functions/retention`, which has to be an edge function
# because Postgres cannot reach R2 — see the header of that file for why the
# order of the two deletes is not negotiable. What is left for a scheduler is
# one authenticated POST a day, which is a curl and not a runtime.
#
# WHY NOT pg_cron. It would put the schedule in the database, where the drift
# job cannot see it and no review can either: a cron entry is a row, so it
# arrives through the SQL editor rather than through a migration, and the one
# job in this project that deletes user data would be the one thing about the
# schema that is not in the repository. Here it is a file, it shows up in a
# diff, and `workflow_dispatch` means anybody can run it by hand while watching
# the log.
#
# A MISSED DAY COSTS NOTHING. The function reads the backlog rather than a
# window, so a run that never happened is picked up by the next one, and a run
# that fills its batch says `remaining: true` and is simply run again.
name: Photo Retention Sweep

on:
  schedule:
    # 19:00 UTC is 03:00 in Kuala Lumpur, which is the quietest hour for the
    # users this app has and well clear of the drift check at 01:00.
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Sweep expired photographs
        env:
          FUNCTIONS_URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
          RETENTION_TOKEN: ${{ secrets.RETENTION_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FUNCTIONS_URL}" ] || [ -z "${RETENTION_TOKEN}" ]; then
            echo "SUPABASE_FUNCTIONS_URL or RETENTION_TOKEN is not set" >&2
            exit 1
          fi

          # Repeated while the function reports a backlog, so the first run
          # after this ships — which has every free account's photographs older
          # than thirty days to get through — finishes rather than deleting one
          # batch a day for a fortnight. Bounded, because a loop with no ceiling
          # in CI is a way to spend an afternoon of minutes on a bug.
          for attempt in $(seq 1 20); do
            # `|| status=$?` rather than letting `set -e` take it, so the body
            # is printed before the job fails: on a refusal the body is the only
            # thing that says which half is misconfigured.
            status=0
            response=$(curl --fail-with-body --silent --show-error \
              --max-time 300 \
              -X POST "${FUNCTIONS_URL}/retention" \
              -H "x-retention-token: ${RETENTION_TOKEN}") || status=$?
            echo "${response}"
            [ "${status}" -eq 0 ] || exit 1

            # `ok` false is a real failure — the function answers 200 with
            # `swept: 0` when there is simply nothing to do.
            echo "${response}" | grep -q '"ok":true' || exit 1
            echo "${response}" | grep -q '"remaining":true' || break
            echo "batch ${attempt} full, more to sweep"
          done
