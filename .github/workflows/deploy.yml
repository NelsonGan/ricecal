name: CI / CD

# Adapted from the money2time workflow of the same name. Three paths, one file:
#
# - **push to main** → production build for both platforms, then submit.
# - **pull_request** → a Worker version under a per-PR alias, then an
#   `eas update` pointed at it, reported in one QR comment.
# - **workflow_dispatch** → one platform, any profile; `development` takes the
#   cloud dev-client path instead of the store one.
#
# The PR pair is the part worth keeping together: a preview is only a preview if
# the JS and the catalogue behind it come from the same commit. The PRODUCTION
# Worker deploy is not here — it lives in `cloudflare.yml`, which runs on main
# when `apps/cloudflare/**` changes, and putting it here too would deploy it
# twice on every merge.
#
# Differences from money2time, all forced by this repo rather than chosen:
#
# - pnpm workspace, so every EAS step runs in `apps/mobile` (that is where
#   `eas.json` and `app.json` live, and the CLI reads the current directory
#   rather than walking up; run it from the root and it writes a stub app.json
#   there and fails).
# - The Worker URL reaches the bundle through a pulled `.env.local` rather than
#   the step's `env:`. money2time can export it because its update command names
#   no environment; ours does, and a named environment overwrites the export.
#   See the note on the pull step.
# - No `APP_VARIANT` on the update step. money2time gates `expo-updates` off for
#   store builds and so has to force it on when publishing; here updates are on
#   for every profile.

run-name: >-
  ${{ github.event_name == 'pull_request' && format('PR Preview · #{0}', github.event.number)
   || github.event_name == 'workflow_dispatch' && format('Manual · {0}/{1}', github.event.inputs.platform, github.event.inputs.profile)
   || github.ref == 'refs/heads/main' && 'Production Release'
   || format('Branch · {0}', github.ref_name) }}

on:
  push:
    branches: [main]
    # A Worker-only commit changes no JS, so there is nothing here to build or
    # publish — and left unfiltered it would archive and SUBMIT a new binary to
    # the stores for a change the app never sees. `.github/workflows/cloudflare.yml`
    # is what runs instead.
    #
    # Push only, deliberately. A pull_request filtered the same way would let a
    # Cloudflare-only PR merge without `pnpm check` ever running on it, and that
    # job also covers the Worker's own lint and the scripts that import from it.
    paths-ignore:
      - 'apps/cloudflare/**'
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        required: true
        default: ios
        options:
          - ios
          - android
      profile:
        description: EAS profile
        type: choice
        default: production
        options:
          - production
          - preview
          - development
      xcode:
        description: Xcode version (iOS only, e.g. 26.3) — blank uses the pinned version
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This job was `ci.yml`, folded in so `pnpm check` runs once per PR rather than
  # twice. Everything downstream needs it anyway, and a separate workflow could
  # not be a `needs:` of one.
  #
  # PRs are the intended path. The push trigger above is a backstop: direct
  # pushes to main are refused by .githooks/pre-push, but that hook is local-only
  # and `--no-verify` skips it, so main is still verified if something gets
  # through.
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # One command, unlike money2time's check-then-test: `pnpm check` here is
      # already turbo typecheck + test followed by a root Biome pass. Lint is a
      # root-level pass rather than a turbo task so it also covers
      # apps/supabase/functions, which is not a workspace package.
      - run: pnpm check
      # The auth emails are built from one layout into `templates/build/`, and
      # those built files are what the local stack reads and what `email:push`
      # sends. Committed and stale, the mail a reviewer reads here is not the
      # mail anybody receives.
      - run: pnpm email:check

  preview-pending:
    name: PR Preview · Pending comment
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Flag preview comment as pending
        uses: actions/github-script@v7
        with:
          script: |
            const commit = context.payload.pull_request.head.sha.slice(0, 7);
            const marker = '<!-- eas-update-preview -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            // Keep the previously published QR/link in place and only flip the
            // status row, so the old build stays scannable meanwhile but is
            // clearly marked as not this commit.
            const pendingStatus = `| **Status** | ⏳ Building \`${commit}\`… — the QR below is still the previous build |`;
            const statusRe = /\| \*\*Status\*\* \|[^\n]*\|/;
            if (existing && statusRe.test(existing.body)) {
              const body = existing.body.replace(statusRe, pendingStatus);
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              const body = [
                marker,
                '## 📱 Preview this update',
                '',
                `⏳ **Building the first preview** for commit \`${commit}\`… This comment updates automatically with a QR code and link the moment it is ready.`,
              ].join('\n');
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            }

  # A PR's own Worker, so the bundle below talks to the catalogue code in the
  # same commit rather than to production's.
  #
  # `versions upload --preview-alias` rather than a second Worker or a named
  # environment: a version takes 0% of production traffic, INHERITS every
  # binding from wrangler.jsonc, and is addressable at a stable per-PR URL. So
  # the preview reads the real 3.2 million packets, there is no second script to
  # keep in step, and nothing to tear down when the PR closes.
  #
  # Sharing the database is safe in the direction that matters: a user's token
  # reaches `/search` and `/food` and nothing else, and the write route needs the
  # shared secret, which a preview version does not hold.
  worker-preview:
    name: PR Preview · Worker
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      # A PR that does not touch the Worker skips the upload and falls back to
      # production, so its EAS preview still searches against a live catalogue
      # rather than failing on a URL that was never uploaded.
      url: ${{ steps.worker.outputs.url || 'https://catalogue.ricecal.app' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Depth 2 so the merge commit's base parent exists for the diff below.
          fetch-depth: 2

      # Only a PR that changes the Worker needs one. Skipping the rest keeps an
      # app-only PR — and a fork PR, whose run gets no Cloudflare secrets — from
      # failing the EAS preview that waits on this job.
      - name: Detect Worker changes
        id: changes
        run: |
          # A PR run checks out the merge commit, so parent 1 is the base branch
          # and this diff is exactly what the PR changes.
          if git diff --name-only HEAD^1 HEAD | grep -qE '^apps/cloudflare/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.changed == 'true'
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        if: steps.changes.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile --filter "./apps/cloudflare/workers/catalogue..."

      # `catalogue` by name, and only it. It is the one Worker the app talks to,
      # so it is the one whose URL a bundle can be pointed at; a second Worker
      # under `workers/` would be checked and deployed by cloudflare.yml like any
      # other and simply have no preview of its own.
      - name: Upload a version under this PR's alias
        if: steps.changes.outputs.changed == 'true'
        id: worker
        working-directory: apps/cloudflare/workers/catalogue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          # A stable alias per PR, so the URL survives a second push and the
          # comment above never goes stale.
          alias="pr-${{ github.event.number }}"
          out=$(pnpm exec wrangler versions upload --preview-alias "$alias" 2>&1 | tee /dev/stderr)
          url=$(printf '%s\n' "$out" | grep -oE "https://${alias}-[a-z0-9.-]+\.workers\.dev" | head -n1)
          if [ -z "$url" ]; then
            echo "::error::Could not parse the aliased Worker preview URL from wrangler output"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

  pr-update:
    name: PR Preview · EAS Update
    needs: [test, worker-preview]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `eas.json` asks for >= 21.4.0 and the repo pins eas-cli in
      # devDependencies; this installs the CLI globally and handles auth. The
      # floor in eas.json is what keeps `latest` from silently going backwards.
      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build update message
        id: message
        env:
          # Through an env var, never inlined: a PR title is attacker-controlled
          # text and this string reaches a shell.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Cosmetic message. Strip double quotes and backticks so a title like
          # Add "X" step does not break the preview action's argv parsing.
          clean="${PR_TITLE//\"/}"
          clean="${clean//\`/}"
          echo "text=${clean}" >> "$GITHUB_OUTPUT"

      # The environment is PULLED to a file rather than named on the update
      # command, and that swap is what makes the next step possible at all.
      #
      # EXPO_PUBLIC_ values are inlined into the bundle by Babel at export time,
      # so they are decided by what this step's process can see — the device and
      # the native build have no say. `eas update --environment development`
      # supplies them, but it does so by ASSIGNING the downloaded values over the
      # process: a URL exported by this workflow is overwritten rather than
      # honoured, silently, and the PR preview goes on talking to production
      # while appearing to work. Measured, not assumed — the same variable set
      # in a step's `env:` came back as the EAS one.
      #
      # Pulled to `.env.local` there is exactly one source for the export to
      # read and no precedence left to get wrong. Skipping it entirely is not an
      # option: the export succeeds with all nine keys undefined and the app
      # throws src/lib/env.ts's "Missing environment variables" on launch.
      #
      # `development` rather than `preview` because the QR is scanned by a
      # development build, whose native side was built with that same
      # environment — the Google iOS client id reaches Info.plist as a URL
      # scheme, so JS pointing at another project would half-work.
      - name: Pull the development environment
        working-directory: apps/mobile
        run: eas env:pull development --non-interactive

      - name: Point this PR's bundle at this PR's Worker
        working-directory: apps/mobile
        env:
          # Through an env var rather than inlined: this is a URL parsed out of
          # another job's stdout.
          WORKER_URL: ${{ needs.worker-preview.outputs.url }}
        run: |
          set -euo pipefail
          # Rewrite in place rather than exporting: see the note above for why an
          # exported value does not survive.
          sed -i.bak "s|^EXPO_PUBLIC_CATALOGUE_URL=.*|EXPO_PUBLIC_CATALOGUE_URL=${WORKER_URL}|" .env.local
          rm -f .env.local.bak
          # Say which one it ended up on. The failure this replaced was invisible
          # precisely because nothing ever printed the value it used.
          grep '^EXPO_PUBLIC_CATALOGUE_URL=' .env.local

      - name: Publish PR update
        id: preview
        uses: expo/expo-github-action/preview@v8
        with:
          working-directory: apps/mobile
          command: eas update --branch pr-${{ github.event.number }} --message "${{ steps.message.outputs.text }}"
          comment: false

      - name: Comment QR code and link
        uses: actions/github-script@v7
        with:
          script: |
            const link = `${{ steps.preview.outputs.link }}`;
            const qr = `${{ steps.preview.outputs.qr }}`;
            const branch = `${{ steps.preview.outputs.branchName }}`;
            const runtime = `${{ steps.preview.outputs.runtimeVersion }}`;
            const commit = context.payload.pull_request.head.sha.slice(0, 7);
            // Which catalogue this build is actually reading. Worth a row of its
            // own: a preview pointed at the wrong Worker looks exactly like one
            // pointed at the right Worker until somebody searches for a dish
            // only this branch knows about.
            const workerUrl = `${{ needs.worker-preview.outputs.url }}`;
            const ownWorker = workerUrl.includes('.workers.dev') && /\/\/pr-\d+-/.test(workerUrl);
            const publishedAt = new Date().toLocaleString('en-US', {
              timeZone: 'Asia/Kuala_Lumpur',
              dateStyle: 'medium',
              timeStyle: 'short',
            }) + ' GMT+8';
            const marker = '<!-- eas-update-preview -->';
            const body = [
              marker,
              '## 📱 Preview this update',
              '',
              'Your changes are published to a preview branch — open them on your device in one tap.',
              '',
              '<table>',
              '<tr>',
              `<td width="260" align="center"><a href="${link}"><img src="${qr}" width="220" alt="EAS Update QR code" /></a><br/><sub>Scan or tap to open with your dev build</sub></td>`,
              '<td valign="middle">',
              '',
              '| | |',
              '| --- | --- |',
              '| **Status** | ✅ Up to date |',
              `| **Branch** | \`${branch}\` |`,
              `| **Runtime** | \`${runtime}\` |`,
              `| **Commit** | \`${commit}\` |`,
              `| **Catalogue** | ${ownWorker ? `[this PR’s Worker ↗](${workerUrl})` : 'production (this PR does not change it)'} |`,
              `| **Published** | ${publishedAt} |`,
              '',
              '</td>',
              '</tr>',
              '</table>',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  plan:
    name: Production · Plan
    needs: test
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.profile != 'development')
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - name: Resolve build matrix
        id: matrix
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo 'include=[{"platform":"ios","label":"iOS","os":"macos-26","profile":"production"},{"platform":"android","label":"Android","os":"ubuntu-latest","profile":"production"}]' >> "$GITHUB_OUTPUT"
          else
            if [ "${{ inputs.platform }}" = "ios" ]; then
              os="macos-26"
              label="iOS"
            else
              os="ubuntu-latest"
              label="Android"
            fi
            echo "include=[{\"platform\":\"${{ inputs.platform }}\",\"label\":\"$label\",\"os\":\"$os\",\"profile\":\"${{ inputs.profile }}\"}]" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Production · App (${{ matrix.label }} · ${{ matrix.profile }})
    needs: plan
    strategy:
      # One platform failing should not cancel the other's 40-minute build.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # No SENTRY_AUTH_TOKEN here on purpose.
      #
      # The Sentry Expo plugin adds an "Upload Debug Symbols to Sentry" phase and
      # a sourcemap upload inside "Bundle React Native code and images"; org and
      # project come from app.json, the token cannot. It lives in the EAS
      # `production` environment instead of a GitHub secret — the same place
      # money2time keeps it, and the reason its workflow never mentions it. EAS
      # injects that environment into `--local` builds too, so one store serves
      # both cloud and runner builds and there is no second copy to rotate.
      #
      # CocoaPods 1.17 dies in `Pod::Config#installation_root` with
      # "Unicode Normalization not appropriate for ASCII-8BIT" when the locale is
      # unset, and a local EAS build runs `pod install`. It surfaces as a generic
      # "something went wrong running pod install", which reads like a dependency
      # problem and is not one. Same fix as the `ios` script in package.json.
      LANG: en_US.UTF-8
    steps:
      - name: Verify branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Deploy can only run on main (got ${{ github.ref }})."
          exit 1

      - uses: actions/checkout@v4

      # An `ubuntu-latest` runner ships ~25 GB free, and a `--local` Android
      # build spends it: NDK toolchains, four ABIs of CMake output for every
      # native module, then the AAB. The 2026-08-03 run filled the disk mid
      # `mergeReleaseNativeLibs` and took the runner's own diagnostics down with
      # it ("No space left on device" writing to _diag), which reads like a
      # broken runner rather than a full one. What this deletes is the image's
      # other language toolchains and its preloaded Docker images — not the
      # Android SDK or the NDK, which are what the build is for.
      - name: Free disk space
        if: matrix.platform == 'android'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc \
            /usr/local/.ghcup /usr/local/share/powershell /usr/local/share/boost || true
          docker image prune --all --force || true
          df -h /

      # Pinned, and the pin has a FLOOR rather than a ceiling — which is the
      # opposite of what this file said before, and the reason the production
      # archive stayed red for two days.
      #
      # Every production archive died in Expo's own "Build ExpoModulesJSI
      # xcframework" script phase, on one line of a dependency we do not own:
      #
      #   JavaScriptCodable+Date.swift:53
      #   guard milliseconds.isFinite, abs(milliseconds) <= maxJavaScriptDateMilliseconds
      #                                                  ^ type of expression is
      #                                                    ambiguous without a
      #                                                    type annotation
      #
      # The first guess was that the runner image had rolled forward onto Xcode
      # 26.3 and broken it, so the fix was to pin back to 26.2. It failed
      # identically, because there had never been a green iOS archive to roll
      # forward FROM: this job's every run has been on a toolchain too old.
      # expo-modules-jsi 57.0.4 needs Swift 6.3 — Expo's own guidance for the
      # SDK is Xcode 26.4 or newer — and that diagnostic is what an older type
      # checker emits instead of saying so. 26.6 builds the same commit's
      # xcframework locally in 20 seconds.
      #
      # Which forces the runner too: `macos-15` ships nothing above Xcode 26.3,
      # so no pin could have worked there. `macos-26` defaults to 26.6 and is
      # where the `os` in the matrix above now points. Keep the two together —
      # a version this action cannot find on the image fails the job outright.
      #
      # The dispatch input overrides it and defaults to blank rather than to a
      # version, so there is one place to change the pin and a dispatch run
      # archives the same toolchain main does unless asked otherwise.
      - name: Select Xcode
        if: matrix.platform == 'ios'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ github.event.inputs.xcode || '26.6' }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Cache eas-build-local
        uses: actions/cache@v4
        with:
          path: ~/.eas-build-local
          key: ${{ runner.os }}-eas-build-local-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-eas-build-local-

      - name: Cache CocoaPods
        if: matrix.platform == 'ios'
        uses: actions/cache@v4
        with:
          path: apps/mobile/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('apps/mobile/ios/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Cache Gradle
        if: matrix.platform == 'android'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - run: pnpm install --frozen-lockfile

      - name: Resolve output path
        id: output
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "ios" ]; then
            ext=ipa
          elif [ "${{ matrix.profile }}" = "production" ]; then
            ext=aab
          else
            ext=apk
          fi
          echo "file=./build/ricecal-${{ matrix.platform }}-${{ matrix.profile }}.$ext" >> "$GITHUB_OUTPUT"

      # `--local` builds on the runner rather than queueing on EAS: no wait for a
      # shared queue, and no per-build charge. The trade is that the runner has to
      # carry the whole native toolchain, which is what the caches above are for.
      #
      # Android's `gradleCommand` in eas.json excludes `:app:lintVitalRelease`,
      # and that exclusion belongs to this job as much as to that file: the
      # 2026-08-04 run died in `:mixpanel-react-native:lintVitalAnalyzeRelease`
      # with "Metaspace", after 22 minutes and 1327 successful tasks. Release
      # lint runs over every third-party library module and holds the whole lint
      # model in a worker capped by the `org.gradle.jvmargs` in the Expo
      # template's gradle.properties — which a managed prebuild regenerates, and
      # which GRADLE_OPTS does not override for the daemon. Nothing about the
      # app's own correctness is being skipped here: `pnpm check` is the gate,
      # and lint's release-blocking pass is checking node_modules.
      - name: Build app
        working-directory: apps/mobile
        env:
          # The collector below searched the local build's working directory and
          # came back empty on every failed archive, which is why two runs' worth
          # of Swift diagnostics were lost. Nothing was wrong with the search:
          # `eas build --local` deletes that directory on the way out, including
          # when it is on the way out because the build failed, so by the time a
          # `failure()` step runs there is nothing left to copy. This keeps it.
          #
          # Set for both platforms even though only iOS has ever needed it. The
          # deletion happens after the artifact exists, so skipping it cannot
          # starve a build of the disk it was going to use — it only leaves the
          # tree behind on a runner that is about to be destroyed anyway.
          EAS_LOCAL_BUILD_SKIP_CLEANUP: '1'
          # No `expo doctor`, and it is the STEP that is the problem rather
          # than anything it reports.
          #
          # `@expo/build-tools` gives it 30 seconds and, on timeout, walks the
          # process tree and kills it. `process.kill` on a descendant that has
          # already exited throws ESRCH; the throw is inside an async
          # `setTimeout` callback nobody catches, so it is an uncaught
          # exception and it takes the whole build with it. The 2026-08-31
          # production run died there — `setup.js:168`, 32 seconds into the
          # doctor phase, before a single file was compiled — while Android
          # built and shipped from the same commit.
          #
          # Nothing is lost by skipping it. Every outcome of that phase ends in
          # `markBuildPhaseHasWarnings()`, so a doctor failure has never been
          # able to fail a build: crashing was the only way this step could
          # change a build's result at all. And it is `npx -y expo-doctor` on a
          # cold runner, which is a package download plus 21 checks against the
          # registry, so it fits in 30 seconds most days and not every day.
          #
          # Run it locally when dependencies change: `npx expo-doctor` in
          # `apps/mobile`, about ten seconds. Today it reports package drift
          # against the SDK and nothing about whether the app builds.
          EAS_BUILD_DISABLE_EXPO_DOCTOR_STEP: '1'
        run: |
          mkdir -p build
          eas build \
            --platform ${{ matrix.platform }} \
            --profile ${{ matrix.profile }} \
            --local \
            --non-interactive \
            --output=${{ steps.output.outputs.file }}

      # A failed archive prints "Refer to Xcode Logs below" and then does not
      # include them: what the job log carries is xcpretty's summary, one line
      # of Swift diagnostic with no file, no line and no target. The real
      # compiler output is gym's raw xcodebuild log, and on a `--local` build it
      # stays on the runner and dies with it. Collect it while the machine is
      # still alive; it is the difference between "some Swift file is ambiguous"
      # and knowing which one.
      - name: Collect build logs
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build-logs
          cp -R ~/Library/Logs/gym build-logs/gym 2>/dev/null || true
          # The local build plugin works out of a temp directory whose name is a
          # fresh uuid per run, so the logs can only be found by searching. The
          # `logs/` subdirectory of that tree is where gym's raw xcodebuild
          # output lands, and it survives the build only because of
          # EAS_LOCAL_BUILD_SKIP_CLEANUP above.
          find "${TMPDIR:-/tmp}" -maxdepth 8 -path '*eas-build-local*' \
            \( -name '*.log' -o -name '*.txt' \) \
            -exec cp {} build-logs/ \; 2>/dev/null || true
          # Say so rather than leaving an empty artifact to be read as "the
          # build printed nothing".
          if [ -z "$(ls -A build-logs 2>/dev/null)" ]; then
            echo "::warning::No build logs found — the local build tree was already gone."
          fi
          ls -la build-logs || true

      - name: Upload build logs
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.platform }}-${{ matrix.profile }}
          path: build-logs
          retention-days: 14
          if-no-files-found: ignore

      # ANDROID LANDS ON CLOSED TESTING, not internal, and the track is in
      # `eas.json` rather than here so a local `eas submit` cannot disagree with
      # CI about where a build goes. It was `internal`, which meant every
      # release then had to be promoted internal to closed by hand — a manual
      # step in the middle of an automated pipeline, which is the kind that gets
      # forgotten rather than the kind that gets noticed. The trade is review:
      # an internal release is available in minutes and a closed one waits for
      # Google, so a deploy no longer means testers have it.
      #
      # iOS is unaffected. `ascAppId` sends it to TestFlight, which is already
      # the equivalent stage.
      - name: Submit build
        working-directory: apps/mobile
        run: |
          eas submit \
            --platform ${{ matrix.platform }} \
            --profile ${{ matrix.profile }} \
            --path ${{ steps.output.outputs.file }} \
            --non-interactive

  dev-build:
    name: Dev · Build (${{ github.event.inputs.platform }})
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'development'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Cloud, not `--local`, and `--no-wait`: a dev client is a one-off artefact
      # someone installs by hand, so there is nothing to gain from holding a
      # runner open for it. The build page link is in the step output.
      - name: Start cloud dev-client build
        working-directory: apps/mobile
        run: |
          eas build \
            --platform ${{ github.event.inputs.platform }} \
            --profile ${{ github.event.inputs.profile }} \
            --non-interactive \
            --no-wait
