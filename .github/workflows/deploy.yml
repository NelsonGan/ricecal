name: CI / CD

# Adapted from the money2time workflow of the same name. Three paths, one file:
#
# - **push to main** → production build for both platforms, then submit.
# - **pull_request** → Test only. A PR publishes nothing: no `eas update`, no
#   Worker version, no preview comment. To try a branch on a device, run it
#   from a dev client against your own Metro.
# - **workflow_dispatch** → one platform, any profile; `development` takes the
#   cloud dev-client path instead of the store one.
#
# The Worker deploy is not here — it lives in `cloudflare.yml`, which runs on
# main when `apps/cloudflare/**` changes, and putting it here too would deploy
# it twice on every merge.
#
# One difference from money2time, forced by this repo rather than chosen: pnpm
# workspace, so every EAS step runs in `apps/mobile` (that is where `eas.json`
# and `app.json` live, and the CLI reads the current directory rather than
# walking up; run it from the root and it writes a stub app.json there and
# fails).

run-name: >-
  ${{ github.event_name == 'pull_request' && format('PR · #{0}', github.event.number)
   || github.event_name == 'workflow_dispatch' && format('Manual · {0}/{1}', github.event.inputs.platform, github.event.inputs.profile)
   || github.ref == 'refs/heads/main' && 'Production Release'
   || format('Branch · {0}', github.ref_name) }}

on:
  push:
    branches: [main]
    # A Worker-only commit changes no JS, so there is nothing here to build or
    # publish — and left unfiltered it would archive and SUBMIT a new binary to
    # the stores for a change the app never sees. `.github/workflows/cloudflare.yml`
    # is what runs instead.
    #
    # Push only, deliberately. A pull_request filtered the same way would let a
    # Cloudflare-only PR merge without `pnpm check` ever running on it, and that
    # job also covers the Worker's own lint and the scripts that import from it.
    #
    # The website and the App Studio are the same case: neither is in the
    # app's bundle. `web.yml` deploys the website, and the studio deploys
    # nothing.
    paths-ignore:
      - 'apps/cloudflare/**'
      - 'apps/web/**'
      - 'apps/app-studio/**'
  # Unlike a Worker, the website and the App Studio are checked by their own
  # workflows (`web.yml`, `app-studio.yml`), so a pull request that touches
  # only them skips this one. A pull request that touches anything else as
  # well still runs it, and `pnpm check` covers both apps then too. No check
  # is required on main; if one ever is, this filter would leave it pending on
  # those pull requests, and it would have to become an `if:` on the job.
  pull_request:
    paths-ignore:
      - 'apps/web/**'
      - 'apps/app-studio/**'
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        required: true
        default: ios
        options:
          - ios
          - android
      profile:
        description: EAS profile
        type: choice
        default: production
        options:
          - production
          - preview
          - development
      xcode:
        description: Xcode version (iOS only, e.g. 27.0) — blank uses the pinned version
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This job was `ci.yml`, folded in so `pnpm check` runs once per PR rather than
  # twice. Everything downstream needs it anyway, and a separate workflow could
  # not be a `needs:` of one.
  #
  # PRs are the intended path. The push trigger above is a backstop: direct
  # pushes to main are refused by .githooks/pre-push, but that hook is local-only
  # and `--no-verify` skips it, so main is still verified if something gets
  # through.
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # One command, unlike money2time's check-then-test: `pnpm check` here is
      # already turbo typecheck + test followed by a root Biome pass. Lint is a
      # root-level pass rather than a turbo task so it also covers
      # apps/supabase/functions, which is not a workspace package.
      - run: pnpm check
      # The auth emails are built from one layout into `templates/build/`, and
      # those built files are what the local stack reads and what `email:push`
      # sends. Committed and stale, the mail a reviewer reads here is not the
      # mail anybody receives.
      - run: pnpm email:check
      # `pnpm check` never runs Metro, so without this a PR that breaks the
      # bundle (an import or asset only Metro resolves, or the `platforms` trap
      # in the README) would first fail in the store build after merge. PRs
      # only: on main the store build bundles right after this anyway.
      - name: Bundle app
        if: github.event_name == 'pull_request'
        working-directory: apps/mobile
        run: pnpm exec expo export --platform ios --platform android --output-dir "$RUNNER_TEMP/expo-export"

  plan:
    name: Production · Plan
    needs: test
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.profile != 'development')
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - name: Resolve build matrix
        id: matrix
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo 'include=[{"platform":"ios","label":"iOS","os":"xcode-27","profile":"production"},{"platform":"android","label":"Android","os":"ubuntu-latest","profile":"production"}]' >> "$GITHUB_OUTPUT"
          else
            if [ "${{ inputs.platform }}" = "ios" ]; then
              os="xcode-27"
              label="iOS"
            else
              os="ubuntu-latest"
              label="Android"
            fi
            echo "include=[{\"platform\":\"${{ inputs.platform }}\",\"label\":\"$label\",\"os\":\"$os\",\"profile\":\"${{ inputs.profile }}\"}]" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Production · App (${{ matrix.label }} · ${{ matrix.profile }})
    needs: plan
    strategy:
      # One platform failing should not cancel the other's 40-minute build.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # No POSTHOG_CLI_API_KEY here on purpose.
      #
      # When that key is set, app.config.ts adds PostHog's Expo plugin, which
      # uploads the Hermes source map and native debug symbols during the build
      # so crash stacks are readable. The key lives in the EAS `production`
      # environment (sensitive visibility) instead of a GitHub secret, the same
      # place money2time keeps it. EAS injects that environment into `--local`
      # builds too, so one store serves both cloud and runner builds and there
      # is no second copy to rotate.
      #
      # CocoaPods 1.17 dies in `Pod::Config#installation_root` with
      # "Unicode Normalization not appropriate for ASCII-8BIT" when the locale is
      # unset, and a local EAS build runs `pod install`. It surfaces as a generic
      # "something went wrong running pod install", which reads like a dependency
      # problem and is not one. Same fix as the `ios` script in package.json.
      LANG: en_US.UTF-8
    steps:
      - name: Verify branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Deploy can only run on main (got ${{ github.ref }})."
          exit 1

      - uses: actions/checkout@v4

      # An `ubuntu-latest` runner ships ~25 GB free, and a `--local` Android
      # build spends it: NDK toolchains, four ABIs of CMake output for every
      # native module, then the AAB. The 2026-08-03 run filled the disk mid
      # `mergeReleaseNativeLibs` and took the runner's own diagnostics down with
      # it ("No space left on device" writing to _diag), which reads like a
      # broken runner rather than a full one. What this deletes is the image's
      # other language toolchains and its preloaded Docker images — not the
      # Android SDK or the NDK, which are what the build is for.
      - name: Free disk space
        if: matrix.platform == 'android'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc \
            /usr/local/.ghcup /usr/local/share/powershell /usr/local/share/boost || true
          docker image prune --all --force || true
          df -h /

      # Pinned, and the pin has a FLOOR rather than a ceiling — which is the
      # opposite of what this file said before, and the reason the production
      # archive stayed red for two days.
      #
      # Every production archive died in Expo's own "Build ExpoModulesJSI
      # xcframework" script phase, on one line of a dependency we do not own:
      #
      #   JavaScriptCodable+Date.swift:53
      #   guard milliseconds.isFinite, abs(milliseconds) <= maxJavaScriptDateMilliseconds
      #                                                  ^ type of expression is
      #                                                    ambiguous without a
      #                                                    type annotation
      #
      # The first guess was that the runner image had rolled forward onto Xcode
      # 26.3 and broken it, so the fix was to pin back to 26.2. It failed
      # identically, because there had never been a green iOS archive to roll
      # forward FROM: this job's every run has been on a toolchain too old.
      # expo-modules-jsi 57.0.4 needs Swift 6.3 — Expo's own guidance for the
      # SDK is Xcode 26.4 or newer — and that diagnostic is what an older type
      # checker emits instead of saying so. 26.6 builds the same commit's
      # xcframework locally in 20 seconds.
      #
      # Which forces the runner too: `macos-15` ships nothing above Xcode 26.3,
      # so no pin could have worked there.
      #
      # 26.6 then built fine, and still shipped the wrong app to iPhone Duo.
      # iOS decides what an app supports from the SDK it was linked against,
      # and a binary from the iOS 26 SDK runs in compatibility mode on the
      # open Duo: a phone-sized window centred on the display, none of the
      # Duo layout. The Duo needs the iOS 27.1 SDK, so this is Xcode 27.1,
      # which GitHub only has on the `xcode-27` image (every `macos-*` image
      # stops at Xcode 26). That is where the `os` in the matrix above points.
      # Keep the two together — a version this action cannot find on the image
      # fails the job outright — and keep the pin at least as new as the
      # newest hardware the app adapts to.
      #
      # The dispatch input overrides it and defaults to blank rather than to a
      # version, so there is one place to change the pin and a dispatch run
      # archives the same toolchain main does unless asked otherwise.
      - name: Select Xcode
        if: matrix.platform == 'ios'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ github.event.inputs.xcode || '27.1' }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up EAS CLI
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 27.5.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Cache eas-build-local
        uses: actions/cache@v4
        with:
          path: ~/.eas-build-local
          key: ${{ runner.os }}-eas-build-local-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-eas-build-local-

      - name: Cache CocoaPods
        if: matrix.platform == 'ios'
        uses: actions/cache@v4
        with:
          path: apps/mobile/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('apps/mobile/ios/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Cache Gradle
        if: matrix.platform == 'android'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - run: pnpm install --frozen-lockfile

      # `pod install` downloads React Native's prebuilt iOS frameworks (about
      # 200 MB) with a bare curl: no retry, no stall timeout. The 2026-10-28
      # release died that way, one tarball crawling at 7 KB/s for 21 minutes
      # before the connection dropped. React Native looks in
      # ~/Library/Caches/ReactNative first, so this fills that folder in
      # advance with retries, a stall timeout and SHA-1 checks, and keeps it
      # between runs. Saved straight after the prefetch rather than at the end,
      # because a cache saved at the end of a failed job is not saved at all.
      - name: Resolve React Native version
        if: matrix.platform == 'ios'
        id: rn
        working-directory: apps/mobile
        run: echo "version=$(node -p "require('react-native/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore React Native artifacts
        if: matrix.platform == 'ios'
        id: rn-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/ReactNative
          key: ${{ runner.os }}-rn-artifacts-${{ steps.rn.outputs.version }}

      - name: Prefetch React Native artifacts
        if: matrix.platform == 'ios'
        run: .github/scripts/prefetch-react-native-ios.sh "${{ steps.rn.outputs.version }}"

      - name: Save React Native artifacts
        if: matrix.platform == 'ios' && steps.rn-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/ReactNative
          key: ${{ runner.os }}-rn-artifacts-${{ steps.rn.outputs.version }}

      - name: Resolve output path
        id: output
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "ios" ]; then
            ext=ipa
          elif [ "${{ matrix.profile }}" = "production" ]; then
            ext=aab
          else
            ext=apk
          fi
          echo "file=./build/ricecal-${{ matrix.platform }}-${{ matrix.profile }}.$ext" >> "$GITHUB_OUTPUT"

      # `--local` builds on the runner rather than queueing on EAS: no wait for a
      # shared queue, and no per-build charge. The trade is that the runner has to
      # carry the whole native toolchain, which is what the caches above are for.
      #
      # Android's `gradleCommand` in eas.json excludes `:app:lintVitalRelease`,
      # and that exclusion belongs to this job as much as to that file: the
      # 2026-08-04 run died in `:mixpanel-react-native:lintVitalAnalyzeRelease`
      # with "Metaspace", after 22 minutes and 1327 successful tasks. Release
      # lint runs over every third-party library module and holds the whole lint
      # model in a worker capped by the `org.gradle.jvmargs` in the Expo
      # template's gradle.properties — which a managed prebuild regenerates, and
      # which GRADLE_OPTS does not override for the daemon. Nothing about the
      # app's own correctness is being skipped here: `pnpm check` is the gate,
      # and lint's release-blocking pass is checking node_modules.
      - name: Build app
        working-directory: apps/mobile
        env:
          # The collector below searched the local build's working directory and
          # came back empty on every failed archive, which is why two runs' worth
          # of Swift diagnostics were lost. Nothing was wrong with the search:
          # `eas build --local` deletes that directory on the way out, including
          # when it is on the way out because the build failed, so by the time a
          # `failure()` step runs there is nothing left to copy. This keeps it.
          #
          # Set for both platforms even though only iOS has ever needed it. The
          # deletion happens after the artifact exists, so skipping it cannot
          # starve a build of the disk it was going to use — it only leaves the
          # tree behind on a runner that is about to be destroyed anyway.
          EAS_LOCAL_BUILD_SKIP_CLEANUP: '1'
        run: |
          mkdir -p build
          eas build \
            --platform ${{ matrix.platform }} \
            --profile ${{ matrix.profile }} \
            --local \
            --non-interactive \
            --output=${{ steps.output.outputs.file }}

      # A failed archive prints "Refer to Xcode Logs below" and then does not
      # include them: what the job log carries is xcpretty's summary, one line
      # of Swift diagnostic with no file, no line and no target. The real
      # compiler output is gym's raw xcodebuild log, and on a `--local` build it
      # stays on the runner and dies with it. Collect it while the machine is
      # still alive; it is the difference between "some Swift file is ambiguous"
      # and knowing which one.
      - name: Collect build logs
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/raw-logs" build-logs
          cp -R ~/Library/Logs/gym "$RUNNER_TEMP/raw-logs/gym" 2>/dev/null || true
          # The local build plugin works out of a temp directory whose name is a
          # fresh uuid per run, so the logs can only be found by searching. The
          # `logs/` subdirectory of that tree is where gym's raw xcodebuild
          # output lands, and it survives the build only because of
          # EAS_LOCAL_BUILD_SKIP_CLEANUP above.
          find "${TMPDIR:-/tmp}" -maxdepth 8 -path '*eas-build-local*' \
            \( -name '*.log' -o -name '*.txt' \) \
            -exec cp {} "$RUNNER_TEMP/raw-logs/" \; 2>/dev/null || true
          # The artifact is public, and GitHub masks secrets in the job log only,
          # never inside an artifact. The raw logs print each script phase's
          # environment, which holds EXPO_TOKEN and whatever EAS injects into
          # the build (POSTHOG_CLI_API_KEY and the like), and the values EAS
          # injects never pass through this step to be redacted by value. So
          # the raw logs stay on the runner, and what is uploaded is the lines
          # around each compiler or build error: the file, the line and the
          # message, which is what the logs are collected for.
          find "$RUNNER_TEMP/raw-logs" -type f | while read -r file; do
            excerpt="build-logs/$(basename "$file").errors.txt"
            grep -n -E -B3 -A8 'error:|fatal error|\*\* (ARCHIVE|BUILD) FAILED|Undefined symbols|ld: |PhaseScriptExecution failed|xcodebuild: error' "$file" > "$excerpt" 2>/dev/null || true
            [ -s "$excerpt" ] || rm -f "$excerpt"
          done
          # Then strip any environment line and the one token this step can see,
          # and upload nothing at all if that token is still in there.
          if [ -n "$(ls -A build-logs 2>/dev/null)" ]; then
            find build-logs -type f -exec perl -ni -e 'print unless /^[0-9]+[-:]\s*(export\s+)?[A-Za-z_][A-Za-z0-9_]*\\?=/' {} +
            if [ -n "${EXPO_TOKEN:-}" ]; then
              find build-logs -type f -exec perl -pi -e 's/\Q$ENV{EXPO_TOKEN}\E/[redacted]/g' {} +
              if grep -rqF -- "$EXPO_TOKEN" build-logs; then
                echo "::warning::A build log still held EXPO_TOKEN after scrubbing, so no logs are uploaded."
                rm -rf build-logs
              fi
            fi
          else
            echo "::warning::No build errors found in the logs, or the local build tree was already gone."
          fi
          ls -la build-logs || true

      - name: Upload build logs
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.platform }}-${{ matrix.profile }}
          path: build-logs
          retention-days: 14
          if-no-files-found: ignore

      # ANDROID LANDS ON PRODUCTION, and the track is in `eas.json` rather than
      # here so a local `eas submit` cannot disagree with CI about where a build
      # goes. It was `internal`, then closed testing, and each of those left one
      # promotion to be done by hand at the end of an automated pipeline, which
      # is the kind of step that gets forgotten rather than the kind that gets
      # noticed. There is no promotion left: a merge to `main` is a release to
      # every Android user, at 100%, as soon as Google's review passes.
      # `releaseStatus` is left at its default of `completed` for that reason. A
      # staged rollout is `releaseStatus: inProgress` with a `rollout` fraction
      # in `eas.json`, and it costs a manual step again to finish.
      #
      # The two platforms are no longer at the same stage after a merge. iOS is
      # unchanged: `ascAppId` sends it to TestFlight, and putting that build in
      # front of users is still a submission somebody makes in App Store Connect.
      - name: Submit build
        working-directory: apps/mobile
        run: |
          eas submit \
            --platform ${{ matrix.platform }} \
            --profile ${{ matrix.profile }} \
            --path ${{ steps.output.outputs.file }} \
            --non-interactive

  dev-build:
    name: Dev · Build (${{ github.event.inputs.platform }})
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'development'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Set up EAS CLI
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 27.5.0
          token: ${{ secrets.EXPO_TOKEN }}

      # Cloud, not `--local`, and `--no-wait`: a dev client is a one-off artefact
      # someone installs by hand, so there is nothing to gain from holding a
      # runner open for it. The build page link is in the step output.
      - name: Start cloud dev-client build
        working-directory: apps/mobile
        run: |
          eas build \
            --platform ${{ github.event.inputs.platform }} \
            --profile ${{ github.event.inputs.profile }} \
            --non-interactive \
            --no-wait
