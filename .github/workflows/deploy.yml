name: CI / CD

# Adapted from the money2time workflow of the same name. Three paths, one file:
#
# - **push to main** → production build for both platforms, then submit.
# - **pull_request** → Test only. A PR publishes nothing: no `eas update`, no
#   Worker version, no preview comment. To try a branch on a device, run it
#   from a dev client against your own Metro.
# - **workflow_dispatch** → one platform or both, any profile; `development`
#   takes the cloud dev-client path instead of the store one. With `submit`
#   off it builds and stops, from any branch: the only way to try a change to
#   the store build before it is on main.
#
# The Worker deploy is not here — it lives in `cloudflare.yml`, which runs on
# main when `apps/cloudflare/**` changes, and putting it here too would deploy
# it twice on every merge.
#
# One difference from money2time, forced by this repo rather than chosen: pnpm
# workspace, so every EAS step runs in `apps/mobile` (that is where `eas.json`
# and `app.json` live, and the CLI reads the current directory rather than
# walking up; run it from the root and it writes a stub app.json there and
# fails).

run-name: >-
  ${{ github.event_name == 'pull_request' && format('PR · #{0}', github.event.number)
   || github.event_name == 'workflow_dispatch' && format('Manual · {0}/{1}{2}', github.event.inputs.platform, github.event.inputs.profile, github.event.inputs.submit == 'false' && ' · build only' || '')
   || github.ref == 'refs/heads/main' && 'Production Release'
   || format('Branch · {0}', github.ref_name) }}

on:
  push:
    branches: [main]
    # A Worker-only commit changes no JS, so there is nothing here to build or
    # publish — and left unfiltered it would archive and SUBMIT a new binary to
    # the stores for a change the app never sees. `.github/workflows/cloudflare.yml`
    # is what runs instead.
    #
    # Push only, deliberately. A pull_request filtered the same way would let a
    # Cloudflare-only PR merge without `pnpm check` ever running on it, and that
    # job also covers the Worker's own lint and the scripts that import from it.
    #
    # The website and the App Studio are the same case: neither is in the
    # app's bundle. `web.yml` deploys the website, and the studio deploys
    # nothing.
    paths-ignore:
      - 'apps/cloudflare/**'
      - 'apps/web/**'
      - 'apps/app-studio/**'
  # Unlike a Worker, the website and the App Studio are checked by their own
  # workflows (`web.yml`, `app-studio.yml`), so a pull request that touches
  # only them skips this one. A pull request that touches anything else as
  # well still runs it, and `pnpm check` covers both apps then too. No check
  # is required on main; if one ever is, this filter would leave it pending on
  # those pull requests, and it would have to become an `if:` on the job.
  pull_request:
    paths-ignore:
      - 'apps/web/**'
      - 'apps/app-studio/**'
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        required: true
        default: ios
        options:
          - ios
          - android
          - all
      profile:
        description: EAS profile
        type: choice
        default: production
        options:
          - production
          - preview
          - development
      xcode:
        description: Xcode version (iOS only, e.g. 27.0) — blank uses the pinned version
        type: string
        default: ''
      submit:
        description: Submit the build to the store (off builds only, and may run from any branch)
        type: boolean
        default: true

# A build-only dispatch gets a group of its own per platform, so trying iOS does
# not cancel a try of Android. Everything that can submit shares one group per
# ref, as before: a release and a dispatch on main must never both reach the
# stores.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.submit == 'false' && github.event.inputs.platform || '' }}
  cancel-in-progress: true

jobs:
  # This job was `ci.yml`, folded in so `pnpm check` runs once per PR rather than
  # twice. Everything downstream needs it anyway, and a separate workflow could
  # not be a `needs:` of one.
  #
  # PRs are the intended path. The push trigger above is a backstop: direct
  # pushes to main are refused by .githooks/pre-push, but that hook is local-only
  # and `--no-verify` skips it, so main is still verified if something gets
  # through.
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      # `cache-dependency-path` is what names the pnpm store cache, and every
      # job that installs the whole workspace names it the same way: the
      # lockfile and the workspace file. The jobs that install one package
      # (`web.yml`, `app-studio.yml`, `cloudflare.yml`) name theirs after the
      # lockfile and that package's manifest, so it is a different cache. They
      # all used to share one name, and a cache is written once: whichever job
      # finished first on a new lockfile saved its store, usually a 285 MB
      # filtered one, and this job then downloaded the other thousand packages
      # on every run. The workspace file rather than the root manifest, which
      # is mostly scripts and would rename the cache for each one added.
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml
      - run: pnpm install --frozen-lockfile

      # Turbo's record of the tasks that already passed, so a package this
      # commit did not touch replays its typecheck and tests instead of running
      # them. A new name per commit, because a cache is never rewritten, with
      # the newest earlier one restored first. The exact Node version is in the
      # name because it is not in Turbo's hash: `node-version: 24` moves with
      # the runner image, and a pass recorded under one Node says nothing about
      # the next. It is only as right as the inputs in `turbo.json`: see the
      # note on `test` there before adding a task that reads outside its own
      # package.
      - name: Restore the Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-node-${{ steps.node.outputs.node-version }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-node-${{ steps.node.outputs.node-version }}-

      # Jest's transform cache (`cacheDirectory` in jest.config.js). Most of it
      # is React Native and Expo compiled by Babel, which is most of a cold run.
      # No `restore-keys`: jest never deletes an entry, so carrying a cache
      # across lockfiles would only grow it.
      - name: Restore the jest cache
        uses: actions/cache@v4
        with:
          path: apps/mobile/node_modules/.cache/jest
          key: jest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # One command, unlike money2time's check-then-test: `pnpm check` here is
      # already turbo typecheck + test followed by a root Biome pass. Lint is a
      # root-level pass rather than a turbo task so it also covers
      # apps/supabase/functions, which is not a workspace package.
      #
      # Only a pull request replays cached tasks. On main this job is the last
      # thing between a commit and both stores, so `TURBO_FORCE` runs every
      # task there for real, and still writes the results pull requests replay.
      # A pull request that went green on a replay it should not have had is
      # then caught here, before anything is built.
      - run: pnpm check
        env:
          TURBO_FORCE: ${{ github.event_name != 'pull_request' }}

      # Every run adds its entries to the ones it restored, so drop what no run
      # has written for two weeks before the cache is saved again.
      - name: Trim the Turbo cache
        run: find .turbo/cache -type f -mtime +14 -delete

      # The auth emails are built from one layout into `templates/build/`, and
      # those built files are what the local stack reads and what `email:push`
      # sends. Committed and stale, the mail a reviewer reads here is not the
      # mail anybody receives.
      - run: pnpm email:check

  # `pnpm check` never runs Metro, so without this a PR that breaks the bundle
  # (an import or asset only Metro resolves, or the `platforms` trap in the
  # README) would first fail in the store build after merge.
  #
  # Its own job, beside Test rather than after it. It was the last step of
  # Test, where it added its minute and a half to every pull request's wait.
  #
  # It runs on main too, where nothing waits on it and the store build bundles
  # anyway, for the cache: a pull request can read a cache saved on main but
  # not one saved by another pull request, so a Metro cache only pull requests
  # wrote would be cold on every new one.
  bundle:
    name: Bundle
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Where Expo's Metro config keeps its transform cache when told to, rather
      # than the runner's temp directory. Inside node_modules for the same
      # reason as jest's.
      EXPO_METRO_CACHE_OUTPUT_DIR: ${{ github.workspace }}/apps/mobile/node_modules/.cache/metro
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml
      - run: pnpm install --frozen-lockfile

      # Metro keys a transform on the file's content and the transformer's
      # options, and resolves every import again on each run, so a kept cache
      # skips the Babel work without hiding the failures this job is here for.
      # No `restore-keys`, as for jest: nothing ever deletes an entry.
      - name: Restore the Metro cache
        uses: actions/cache@v4
        with:
          path: apps/mobile/node_modules/.cache/metro
          key: metro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Bundle app
        working-directory: apps/mobile
        run: pnpm exec expo export --platform ios --platform android --output-dir "$RUNNER_TEMP/expo-export"

  plan:
    name: Production · Plan
    needs: test
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.profile != 'development')
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - name: Resolve build matrix
        id: matrix
        shell: bash
        env:
          # A push builds both platforms for production; a dispatch builds what
          # it was asked for.
          PLATFORM: ${{ github.event_name == 'push' && 'all' || inputs.platform }}
          PROFILE: ${{ github.event_name == 'push' && 'production' || inputs.profile }}
        run: |
          ios="{\"platform\":\"ios\",\"label\":\"iOS\",\"os\":\"xcode-27\",\"profile\":\"$PROFILE\"}"
          android="{\"platform\":\"android\",\"label\":\"Android\",\"os\":\"ubuntu-latest\",\"profile\":\"$PROFILE\"}"
          case "$PLATFORM" in
            ios) include="[$ios]" ;;
            android) include="[$android]" ;;
            *) include="[$ios,$android]" ;;
          esac
          echo "include=$include" >> "$GITHUB_OUTPUT"

  deploy:
    name: Production · App (${{ matrix.label }} · ${{ matrix.profile }})
    needs: plan
    strategy:
      # One platform failing should not cancel the other's 40-minute build.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # The one place the Xcode pin is written (see "Select Xcode").
      XCODE_VERSION: ${{ github.event.inputs.xcode || '27.1' }}
      # Whether this run ends in a store. A push always does. A dispatch does
      # when it asks to and builds the production profile, which is the only
      # one `eas.json` has a submit profile for: a preview build has nowhere
      # to be submitted to.
      WILL_SUBMIT: ${{ github.event_name != 'workflow_dispatch' || (inputs.submit && inputs.profile == 'production') }}
      # No POSTHOG_CLI_API_KEY here on purpose.
      #
      # When that key is set, app.config.ts adds PostHog's Expo plugin, which
      # uploads the Hermes source map and native debug symbols during the build
      # so crash stacks are readable. The key lives in the EAS `production`
      # environment (sensitive visibility) instead of a GitHub secret, the same
      # place money2time keeps it. EAS injects that environment into `--local`
      # builds too, so one store serves both cloud and runner builds and there
      # is no second copy to rotate.
      #
      # CocoaPods 1.17 dies in `Pod::Config#installation_root` with
      # "Unicode Normalization not appropriate for ASCII-8BIT" when the locale is
      # unset, and a local EAS build runs `pod install`. It surfaces as a generic
      # "something went wrong running pod install", which reads like a dependency
      # problem and is not one. Same fix as the `ios` script in package.json.
      LANG: en_US.UTF-8
    steps:
      # Only a build that will be submitted has to come from main. One that
      # stops after the build may run from a branch.
      - name: Verify branch
        if: github.ref != 'refs/heads/main' && env.WILL_SUBMIT == 'true'
        run: |
          echo "Only main can be submitted to the stores (got ${{ github.ref }})."
          exit 1

      - uses: actions/checkout@v4

      # An `ubuntu-latest` runner ships ~25 GB free, and a `--local` Android
      # build spends it: NDK toolchains, four ABIs of CMake output for every
      # native module, then the AAB. The 2026-08-03 run filled the disk mid
      # `mergeReleaseNativeLibs` and took the runner's own diagnostics down with
      # it ("No space left on device" writing to _diag), which reads like a
      # broken runner rather than a full one. What this deletes is the image's
      # other language toolchains and its preloaded Docker images — not the
      # Android SDK or the NDK, which are what the build is for.
      - name: Free disk space
        if: matrix.platform == 'android'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc \
            /usr/local/.ghcup /usr/local/share/powershell /usr/local/share/boost || true
          docker image prune --all --force || true
          df -h /

      # Pinned, and the pin has a FLOOR rather than a ceiling — which is the
      # opposite of what this file said before, and the reason the production
      # archive stayed red for two days.
      #
      # Every production archive died in Expo's own "Build ExpoModulesJSI
      # xcframework" script phase, on one line of a dependency we do not own:
      #
      #   JavaScriptCodable+Date.swift:53
      #   guard milliseconds.isFinite, abs(milliseconds) <= maxJavaScriptDateMilliseconds
      #                                                  ^ type of expression is
      #                                                    ambiguous without a
      #                                                    type annotation
      #
      # The first guess was that the runner image had rolled forward onto Xcode
      # 26.3 and broken it, so the fix was to pin back to 26.2. It failed
      # identically, because there had never been a green iOS archive to roll
      # forward FROM: this job's every run has been on a toolchain too old.
      # expo-modules-jsi 57.0.4 needs Swift 6.3 — Expo's own guidance for the
      # SDK is Xcode 26.4 or newer — and that diagnostic is what an older type
      # checker emits instead of saying so. 26.6 builds the same commit's
      # xcframework locally in 20 seconds.
      #
      # Which forces the runner too: `macos-15` ships nothing above Xcode 26.3,
      # so no pin could have worked there.
      #
      # 26.6 then built fine, and still shipped the wrong app to iPhone Duo.
      # iOS decides what an app supports from the SDK it was linked against,
      # and a binary from the iOS 26 SDK runs in compatibility mode on the
      # open Duo: a phone-sized window centred on the display, none of the
      # Duo layout. The Duo needs the iOS 27.1 SDK, so this is Xcode 27.1,
      # which GitHub only has on the `xcode-27` image (every `macos-*` image
      # stops at Xcode 26). That is where the `os` in the matrix above points.
      # Keep the two together — a version this action cannot find on the image
      # fails the job outright — and keep the pin at least as new as the
      # newest hardware the app adapts to.
      #
      # The pin itself is `XCODE_VERSION` in this job's `env`, because the
      # compiler cache is named after it too. The dispatch input overrides it
      # and defaults to blank rather than to a version, so there is one place
      # to change the pin and a dispatch run archives the same toolchain main
      # does unless asked otherwise.
      - name: Select Xcode
        if: matrix.platform == 'ios'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml

      - name: Set up Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 9.x, because 8.x cannot cache: it talks to the cache service GitHub
      # retired in 2025, so its restore answered "Cache service responded with
      # 400" and every build job installed the CLI and its 329 dependencies
      # again, 25 to 58 seconds each time.
      - name: Set up EAS CLI
        uses: expo/expo-github-action@9da89d3617bb88139671bad31b09c65714c2ee06 # 9.0.1
        with:
          eas-version: 27.5.0
          token: ${{ secrets.EXPO_TOKEN }}

      # The two caches below are named after the lockfile, and nothing under
      # `ios/` or `android/`. Those folders are prebuild output: they are not in
      # the repository, and `eas build --local` prebuilds in a temp directory,
      # so they are never in this checkout either. The caches that were here
      # hashed files in them and got the empty string back. Gradle's was
      # therefore named `Linux-gradle-` for good, saved once in August 2026 and
      # restored unchanged ever since (2.2 GB and 44 seconds a build, of
      # dependencies the app had long moved past). CocoaPods' pointed at
      # `ios/Pods`, which never existed, so it saved nothing at all.
      #
      # No `restore-keys` on either. Neither tool deletes what it has cached, so
      # a cache carried from one lockfile to the next only grows; a new lockfile
      # costs one cold build and starts a clean one instead.
      #
      # Restored here and saved straight after the build rather than by one
      # step's post-run, for the reason given at the React Native artifacts
      # below: a cache saved at the end of a job is not saved when the submit
      # fails, and the retry would then download everything again.

      # What `pod install` downloads: every pod's source, Hermes included. It
      # checks each entry against the pod's version and checksum before using it.
      - name: Restore CocoaPods downloads
        if: matrix.platform == 'ios'
        id: pods-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Restore Gradle
        if: matrix.platform == 'android'
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('pnpm-lock.yaml') }}

      # Most of a store build is compiling C, C++ and Objective-C that has not
      # changed since the last one: React Native's libraries, Skia, Reanimated,
      # the code generated for every native module. ccache keeps each compiled
      # file under a hash of its source, the headers it includes, the flags and
      # the compiler, and hands it back when all of them match.
      #
      # Three things make that work on a fresh runner:
      #
      # - `CCACHE_COMPILERCHECK` asks the compiler for its version instead of
      #   looking at the binary's timestamp, which changes with every runner
      #   image. On iOS the binary is also `/usr/bin/clang`, a shim that is
      #   identical whichever Xcode is selected.
      # - the build runs in the same directory every time (see
      #   `EAS_LOCAL_BUILD_WORKINGDIR` at the build step), because the paths in
      #   a compile command are part of what ccache compares.
      # - `CCACHE_SLOPPINESS` lets it use headers written moments before the
      #   compile, which is every header on a runner that has just installed
      #   them. Android only: on iOS React Native's own `ccache.conf` sets a
      #   longer list, and a variable here would replace it.
      #
      # All of it is set through the environment and none through ccache's
      # config files. React Native's iOS wrapper names its own config file
      # (`CCACHE_CONFIGPATH`), and ccache then reads no other, so a setting
      # written to the system file reached Android's compiles and never iOS's.
      #
      # React Native already knows about ccache on both platforms: its Podfile
      # hook wraps the compiler when `USE_CCACHE=1`, and its CMake file for the
      # app uses ccache whenever it is installed. The two `CMAKE_*_LAUNCHER`
      # variables extend that to the libraries with their own CMake project
      # (Reanimated, Worklets, Skia, Nitro).
      #
      # `CCACHE_BINARY` is exported because the iOS half does nothing without
      # it, and says nothing either. The Podfile hook points Xcode's compiler at
      # a wrapper script that runs `$CCACHE_BINARY clang`, and sets that name as
      # a build setting. Xcode 27 does not hand build settings to a compile, so
      # the wrapper ran plain `clang`: a first build with ccache "on" compiled
      # for 22 minutes and recorded no calls at all. A variable in the
      # environment does reach the compile.
      #
      # The build does not need any of this, so nothing here may stop a
      # release: if the install fails, the variables are never exported and the
      # build compiles everything as it always did.
      - name: Set up the compiler cache
        id: ccache-setup
        continue-on-error: true
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install ccache
          else
            install() { sudo apt-get install -y -qq ccache > /dev/null; }
            install || { sudo apt-get update -qq && install; }
            echo "CCACHE_SLOPPINESS=include_file_ctime,include_file_mtime,time_macros" >> "$GITHUB_ENV"
          fi
          ccache --version | head -1
          {
            echo "CCACHE_BINARY=$(command -v ccache)"
            echo "CCACHE_DIR=$HOME/.cache/ccache"
            echo "CCACHE_MAXSIZE=2G"
            echo "CCACHE_COMPILERCHECK=%compiler% -v"
            echo "USE_CCACHE=1"
            echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
          } >> "$GITHUB_ENV"

      # A new name on every run, so this never restores by its own name: it
      # takes the newest cache for this lockfile, or failing that the newest
      # for this toolchain, since most of what a new lockfile compiles is what
      # the old one did. Unlike Gradle's and CocoaPods' caches, ccache keeps
      # itself under `CCACHE_MAXSIZE`, so carrying it forward cannot grow it.
      # Whether to save one is decided after the build, from what it did.
      - name: Restore the compiler cache
        if: steps.ccache-setup.outcome == 'success'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.platform }}-${{ matrix.platform == 'ios' && env.XCODE_VERSION || 'ndk' }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ matrix.platform }}-${{ matrix.platform == 'ios' && env.XCODE_VERSION || 'ndk' }}-${{ hashFiles('pnpm-lock.yaml') }}
            ccache-${{ matrix.platform }}-${{ matrix.platform == 'ios' && env.XCODE_VERSION || 'ndk' }}-

      - run: pnpm install --frozen-lockfile

      # `pod install` downloads React Native's prebuilt iOS frameworks (about
      # 200 MB) with a bare curl: no retry, no stall timeout. The 2026-10-28
      # release died that way, one tarball crawling at 7 KB/s for 21 minutes
      # before the connection dropped. React Native looks in
      # ~/Library/Caches/ReactNative first, so this fills that folder in
      # advance with retries, a stall timeout and SHA-1 checks, and keeps it
      # between runs. Saved straight after the prefetch rather than at the end,
      # because a cache saved at the end of a failed job is not saved at all.
      - name: Resolve React Native version
        if: matrix.platform == 'ios'
        id: rn
        working-directory: apps/mobile
        run: echo "version=$(node -p "require('react-native/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore React Native artifacts
        if: matrix.platform == 'ios'
        id: rn-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/ReactNative
          key: ${{ runner.os }}-rn-artifacts-${{ steps.rn.outputs.version }}

      - name: Prefetch React Native artifacts
        if: matrix.platform == 'ios'
        run: .github/scripts/prefetch-react-native-ios.sh "${{ steps.rn.outputs.version }}"

      - name: Save React Native artifacts
        if: matrix.platform == 'ios' && steps.rn-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/ReactNative
          key: ${{ runner.os }}-rn-artifacts-${{ steps.rn.outputs.version }}

      - name: Resolve output path
        id: output
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "ios" ]; then
            ext=ipa
          elif [ "${{ matrix.profile }}" = "production" ]; then
            ext=aab
          else
            ext=apk
          fi
          echo "file=./build/ricecal-${{ matrix.platform }}-${{ matrix.profile }}.$ext" >> "$GITHUB_OUTPUT"

      # `--local` builds on the runner rather than queueing on EAS: no wait for a
      # shared queue, and no per-build charge. The trade is that the runner has to
      # carry the whole native toolchain, which is what the caches above are for.
      #
      # Android's `gradleCommand` in eas.json excludes `:app:lintVitalRelease`,
      # and that exclusion belongs to this job as much as to that file: the
      # 2026-08-04 run died in `:mixpanel-react-native:lintVitalAnalyzeRelease`
      # with "Metaspace", after 22 minutes and 1327 successful tasks. Release
      # lint runs over every third-party library module and holds the whole lint
      # model in a worker capped by the `org.gradle.jvmargs` in the Expo
      # template's gradle.properties — which a managed prebuild regenerates, and
      # which GRADLE_OPTS does not override for the daemon. Nothing about the
      # app's own correctness is being skipped here: `pnpm check` is the gate,
      # and lint's release-blocking pass is checking node_modules.
      - name: Build app
        working-directory: apps/mobile
        env:
          # The collector below searched the local build's working directory and
          # came back empty on every failed archive, which is why two runs' worth
          # of Swift diagnostics were lost. Nothing was wrong with the search:
          # `eas build --local` deletes that directory on the way out, including
          # when it is on the way out because the build failed, so by the time a
          # `failure()` step runs there is nothing left to copy. This keeps it.
          #
          # Set for both platforms even though only iOS has ever needed it. The
          # deletion happens after the artifact exists, so skipping it cannot
          # starve a build of the disk it was going to use — it only leaves the
          # tree behind on a runner that is about to be destroyed anyway.
          EAS_LOCAL_BUILD_SKIP_CLEANUP: '1'
          # The same directory on every run, where the default is a new random
          # one under the temp folder. See "Set up the compiler cache".
          EAS_LOCAL_BUILD_WORKINGDIR: ${{ runner.temp }}/eas-build-local
        run: |
          mkdir -p build
          # The counters come back with the restored cache; start them at zero
          # so the statistics step below describes this build alone.
          ccache --zero-stats || true
          eas build \
            --platform ${{ matrix.platform }} \
            --profile ${{ matrix.profile }} \
            --local \
            --non-interactive \
            --output=${{ steps.output.outputs.file }}

      # How much of the build came out of the cache, in the job log, and
      # whether what is in it now is worth keeping. A build that found nearly
      # everything adds nothing by saving again. One that missed more than a
      # twentieth of its compiles has new objects in it: a cold start, a new
      # lockfile or Xcode, or a cache that was restored and turned out not to
      # match. Saving on that test rather than on "there was nothing to
      # restore" is what stops a useless cache from being kept for good.
      - name: Compiler cache statistics
        id: ccache-stats
        if: ${{ !cancelled() && steps.ccache-setup.outcome == 'success' }}
        continue-on-error: true
        run: |
          ccache --show-stats --verbose
          stat() { ccache --print-stats | awk -v k="$1" '$1 == k { print $2 }'; }
          misses=$(stat cache_miss)
          misses=${misses:-0}
          direct=$(stat direct_cache_hit)
          preprocessed=$(stat preprocessed_cache_hit)
          hits=$(( ${direct:-0} + ${preprocessed:-0} ))
          echo "hits=$hits misses=$misses"
          if [ "$misses" -gt 0 ] && [ $(( misses * 20 )) -gt $(( hits + misses )) ]; then
            echo "save=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save the compiler cache
        if: ${{ !cancelled() && steps.ccache-stats.outputs.save == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.platform }}-${{ matrix.platform == 'ios' && env.XCODE_VERSION || 'ndk' }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save CocoaPods downloads
        if: matrix.platform == 'ios' && steps.pods-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ steps.pods-cache.outputs.cache-primary-key }}

      - name: Save Gradle
        if: matrix.platform == 'android' && steps.gradle-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      # A failed archive prints "Refer to Xcode Logs below" and then does not
      # include them: what the job log carries is xcpretty's summary, one line
      # of Swift diagnostic with no file, no line and no target. The real
      # compiler output is gym's raw xcodebuild log, and on a `--local` build it
      # stays on the runner and dies with it. Collect it while the machine is
      # still alive; it is the difference between "some Swift file is ambiguous"
      # and knowing which one.
      - name: Collect build logs
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/raw-logs" build-logs
          cp -R ~/Library/Logs/gym "$RUNNER_TEMP/raw-logs/gym" 2>/dev/null || true
          # The local build's working directory (EAS_LOCAL_BUILD_WORKINGDIR
          # above). Its `logs/` subdirectory is where gym's raw xcodebuild
          # output lands, and it survives the build only because of
          # EAS_LOCAL_BUILD_SKIP_CLEANUP above.
          find "$RUNNER_TEMP/eas-build-local" -maxdepth 6 \
            \( -name '*.log' -o -name '*.txt' \) \
            -exec cp {} "$RUNNER_TEMP/raw-logs/" \; 2>/dev/null || true
          # The artifact is public, and GitHub masks secrets in the job log only,
          # never inside an artifact. The raw logs print each script phase's
          # environment, which holds EXPO_TOKEN and whatever EAS injects into
          # the build (POSTHOG_CLI_API_KEY and the like), and the values EAS
          # injects never pass through this step to be redacted by value. So
          # the raw logs stay on the runner, and what is uploaded is the lines
          # around each compiler or build error: the file, the line and the
          # message, which is what the logs are collected for.
          find "$RUNNER_TEMP/raw-logs" -type f | while read -r file; do
            excerpt="build-logs/$(basename "$file").errors.txt"
            grep -n -E -B3 -A8 'error:|fatal error|\*\* (ARCHIVE|BUILD) FAILED|Undefined symbols|ld: |PhaseScriptExecution failed|xcodebuild: error' "$file" > "$excerpt" 2>/dev/null || true
            [ -s "$excerpt" ] || rm -f "$excerpt"
          done
          # Then strip any environment line and the one token this step can see,
          # and upload nothing at all if that token is still in there.
          if [ -n "$(ls -A build-logs 2>/dev/null)" ]; then
            find build-logs -type f -exec perl -ni -e 'print unless /^[0-9]+[-:]\s*(export\s+)?[A-Za-z_][A-Za-z0-9_]*\\?=/' {} +
            if [ -n "${EXPO_TOKEN:-}" ]; then
              find build-logs -type f -exec perl -pi -e 's/\Q$ENV{EXPO_TOKEN}\E/[redacted]/g' {} +
              if grep -rqF -- "$EXPO_TOKEN" build-logs; then
                echo "::warning::A build log still held EXPO_TOKEN after scrubbing, so no logs are uploaded."
                rm -rf build-logs
              fi
            fi
          else
            echo "::warning::No build errors found in the logs, or the local build tree was already gone."
          fi
          ls -la build-logs || true

      - name: Upload build logs
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.platform }}-${{ matrix.profile }}
          path: build-logs
          retention-days: 14
          if-no-files-found: ignore

      # ANDROID LANDS ON PRODUCTION, and the track is in `eas.json` rather than
      # here so a local `eas submit` cannot disagree with CI about where a build
      # goes. It was `internal`, then closed testing, and each of those left one
      # promotion to be done by hand at the end of an automated pipeline, which
      # is the kind of step that gets forgotten rather than the kind that gets
      # noticed. There is no promotion left: a merge to `main` is a release to
      # every Android user, at 100%, as soon as Google's review passes.
      # `releaseStatus` is left at its default of `completed` for that reason. A
      # staged rollout is `releaseStatus: inProgress` with a `rollout` fraction
      # in `eas.json`, and it costs a manual step again to finish.
      #
      # The two platforms are no longer at the same stage after a merge. iOS is
      # unchanged: `ascAppId` sends it to TestFlight, and putting that build in
      # front of users is still a submission somebody makes in App Store Connect.
      - name: Submit build
        if: env.WILL_SUBMIT == 'true'
        working-directory: apps/mobile
        run: |
          eas submit \
            --platform ${{ matrix.platform }} \
            --profile ${{ matrix.profile }} \
            --path ${{ steps.output.outputs.file }} \
            --non-interactive

  dev-build:
    name: Dev · Build (${{ github.event.inputs.platform }})
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'development'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml
      - run: pnpm install --frozen-lockfile

      - name: Set up EAS CLI
        uses: expo/expo-github-action@9da89d3617bb88139671bad31b09c65714c2ee06 # 9.0.1
        with:
          eas-version: 27.5.0
          token: ${{ secrets.EXPO_TOKEN }}

      # Cloud, not `--local`, and `--no-wait`: a dev client is a one-off artefact
      # someone installs by hand, so there is nothing to gain from holding a
      # runner open for it. The build page link is in the step output.
      - name: Start cloud dev-client build
        working-directory: apps/mobile
        run: |
          eas build \
            --platform ${{ github.event.inputs.platform }} \
            --profile ${{ github.event.inputs.profile }} \
            --non-interactive \
            --no-wait
