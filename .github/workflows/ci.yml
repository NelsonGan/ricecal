name: CI

# PRs are the intended path. The push trigger is a backstop: direct pushes to
# main are refused by .githooks/pre-push, but that hook is local-only and
# `--no-verify` skips it, so main is still verified if something gets through.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Lint is a single root-level Biome pass rather than a turbo task, so it
      # also covers supabase/functions, which is not a workspace package.
      - run: pnpm check
