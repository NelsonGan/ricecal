# TEMPORARY: proves the iOS production build works on the xcode-27 runner.
# Builds without submitting. Delete before merging.
name: Xcode 27 probe
on:
  pull_request:
    paths: [.github/workflows/xcode27-probe.yml]
jobs:
  ios:
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - name: Build app (no submit)
        working-directory: apps/mobile
        run: |
          xcodebuild -version
          mkdir -p build
          eas build --platform ios --profile production --local --non-interactive --output=./build/probe.ipa
      - name: Check linked SDK
        working-directory: apps/mobile
        run: |
          unzip -q -o build/probe.ipa -d build/ipa
          plist=$(ls -d build/ipa/Payload/*.app)/Info.plist
          for k in DTSDKName DTPlatformVersion DTXcode DTXcodeBuild CFBundleVersion; do
            echo "$k = $(/usr/libexec/PlistBuddy -c "Print :$k" "$plist")"
          done
          /usr/libexec/PlistBuddy -c "Print :DTSDKName" "$plist" | grep -q '^iphoneos27\.[1-9]'
