# Structural enforcement of the code-only policy.
#
# There is no hosted toggle to make the Supabase dashboard read-only on our
# plan, so instead we detect: any edit made in the Table Editor or SQL Editor
# shows up as a diff against the committed migrations and turns this job red.
#
# This matters MORE than the original plan assumed, because the Supabase MCP
# server is connected with write access. Anything applied through that
# connection is, from the database's point of view, indistinguishable from a
# dashboard edit — it bypasses migrations entirely. This job is the only thing
# that notices.
#
# Deploys themselves are handled by the Supabase GitHub integration, not by a
# workflow. This job is detection only; it never writes to the project.
name: Supabase Drift Check

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    # The Supabase project lives in apps/supabase, and the CLI resolves
    # `supabase/config.toml` relative to the working directory. Setting it once
    # here keeps every `run` step — and the migration globs below — written
    # exactly as they would be from a project root.
    defaults:
      run:
        working-directory: apps
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # PINNED, not `latest`. Resolving "latest" costs a GitHub API call on
          # every run, and that call is rate-limited per runner IP — shared
          # runners hit the ceiling and the job fails before it has read a line
          # of SQL, which reads as a schema problem and is not one. Keep this in
          # step with the `supabase` devDependency in package.json so CI and a
          # developer's machine run the same diff engine.
          version: 2.110.0
      - run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
      - name: Diff remote schema against migrations
        run: |
          # Three attempts with a widening gap, because the diff opens ~27
          # parallel connections to read the remote catalog and one of them
          # times out often enough that a single retry does not cover it.
          #
          # A flaky red here is worse than a slow green. This job is supposed to
          # mean "somebody edited the database by hand", and a detector that
          # cries wolf is one nobody reads — which is exactly how it came to sit
          # red for days on a stale password without anyone noticing.
          for attempt in 1 2 3; do
            rm -f supabase/migrations/*drift*
            if supabase db diff --linked -f drift; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::Could not read the remote schema after three attempts"
              exit 1
            fi
            echo "Diff attempt $attempt failed, retrying in $((attempt * 30))s…"
            sleep $((attempt * 30))
          done

          [ -n "$(ls supabase/migrations/*drift* 2>/dev/null)" ] || exit 0

          echo "Raw diff against the remote:"
          cat supabase/migrations/*drift*

          # WHAT IS IGNORED, AND WHY IT IS NOT A LOOPHOLE.
          #
          # The shadow database is built from the Supabase base image, and that
          # image is not identical to a live project's baseline. Two differences
          # come out of it every single run and neither is anybody's edit:
          #
          #   pg_net              NO LONGER EMITTED, and the line stays anyway.
          #                       It was installed in the base image and absent
          #                       from the live project, so every run wanted to
          #                       drop it. `20260820120000_retention_runs_on_pg_cron.sql`
          #                       installs it for real — the retention sweep's
          #                       schedule POSTs through it — so the two now
          #                       agree and the statement stops appearing. Kept
          #                       because it costs nothing and the day somebody
          #                       drops the extension by hand is not the day to
          #                       find out this filter was load-bearing.
          #   sequence privileges the image grants UPDATE on public sequences to
          #                       anon/authenticated/service_role; the live
          #                       project has them revoked.
          #
          # They are matched as WHOLE STATEMENTS rather than by keyword, so a
          # real `drop extension` or a real privilege change still turns this
          # red. The raw diff is printed above either way — this filter decides
          # the exit code, not what a human gets to see.
          # `|| true` is not decoration. The step runs under `bash -e`, and a
          # grep that selects nothing exits 1 — so the moment this filter works
          # perfectly and removes every line, it takes the whole job down with
          # it. The good case looked exactly like the bad one.
          UNEXPLAINED=$(
            cat supabase/migrations/*drift* \
              | grep -vE '^\s*--' \
              | grep -vE '^\s*$' \
              | grep -vxF 'DROP EXTENSION pg_net;' \
              | grep -vxE 'ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public REVOKE UPDATE ON SEQUENCES FROM (anon|authenticated|service_role);' \
              || true
          )

          if [ -n "$UNEXPLAINED" ]; then
            echo "::error::Remote schema has drifted from migrations"
            echo "$UNEXPLAINED"
            exit 1
          fi

          echo "No drift: everything in the diff is known base-image noise."
