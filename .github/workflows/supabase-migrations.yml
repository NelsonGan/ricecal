# The free stand-in for preview branches.
#
# Real Supabase preview branches need the Pro plan ($0.01344/branch/hour). This
# job catches most of what they would catch — migrations that do not apply from
# scratch, and declared schema that was never turned into a migration — using
# throwaway Postgres on the runner. It costs nothing and needs no secrets,
# because it never touches the remote project.
#
# When you do upgrade to Pro and enable branching, this stays useful: it fails
# in ~1 minute without provisioning anything, where a branch takes longer and
# bills by the hour.
name: Supabase Migrations

on:
  pull_request:
    paths: ['apps/supabase/**']

jobs:
  migrations:
    runs-on: ubuntu-latest
    # The Supabase project lives in apps/supabase, and the CLI resolves
    # `supabase/config.toml` relative to the working directory. Setting it once
    # here keeps every `run` step — and the globs below — written exactly as
    # they would be from a project root.
    defaults:
      run:
        working-directory: apps
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # PINNED, not `latest`. Resolving "latest" costs a GitHub API call on
          # every run, and that call is rate-limited per runner IP — shared
          # runners hit the ceiling and the job fails before it has read a line
          # of SQL, which reads as a schema problem and is not one. Keep this in
          # step with the `supabase` devDependency in package.json so CI and a
          # developer's machine run the same diff engine.
          version: 2.110.0

      - name: Start local Postgres
        run: supabase db start

      # Applies every migration in order against an empty database. Catches the
      # failure mode that only ever shows up on a fresh environment: a migration
      # that works against your dev database because of state a previous
      # hand-edit left behind.
      - name: Migrations apply cleanly from scratch
        run: supabase db reset --local

      # pgTAP. The RLS suite is the reason this job exists at all: a missing
      # policy does not fail, it returns other people's rows, and nothing else
      # in the pipeline would notice. The tests run as the `authenticated` role
      # with a forged JWT claim, exactly as PostgREST does.
      #
      # Skipped rather than failed when the directory is empty, so the step
      # does not have to be added and removed as the suite comes and goes.
      - name: Database tests
        run: |
          if ! compgen -G "supabase/tests/*.test.sql" > /dev/null; then
            echo "supabase/tests/ has no test files yet — nothing to run."
            exit 0
          fi
          supabase test db

      # Enforces the declarative workflow. `db diff` compares supabase/schemas/
      # against the migrations; if it produces output, someone edited a schema
      # file and did not run `supabase db diff -f <name>` to capture it. Without
      # this check that divergence is invisible until deploy.
      - name: Declared schema is fully captured in migrations
        run: |
          # `db diff` provisions a shadow database from schema_paths, and the CLI
          # treats a glob matching zero files as a hard error:
          #   no files matched pattern: supabase/schemas/*.sql
          #   failed to provision the shadow database: exit 1
          # It does not report "no diff". Phase 0 ships this directory empty, so
          # the check has to no-op until the first schema file exists.
          if ! compgen -G "supabase/schemas/*.sql" > /dev/null; then
            echo "supabase/schemas/ has no .sql files yet — nothing to compare."
            exit 0
          fi
          supabase db diff -f ci_uncaptured
          if compgen -G "supabase/migrations/*ci_uncaptured*" > /dev/null; then
            echo "::error::supabase/schemas/ contains changes with no matching migration."
            echo "Run: pnpm supabase db diff -f <descriptive_name> and commit the result."
            cat supabase/migrations/*ci_uncaptured*
            exit 1
          fi
          echo "schemas/ and migrations/ are in sync"

  # The edge functions are TypeScript that nothing else in this repo checks.
  # They live outside the pnpm workspace and Supabase deploys them by bundling,
  # not by compiling — so a type error ships, and only shows up as a scan that
  # answers wrong at runtime. `deno check` is the compiler the deployment does
  # not run.
  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # One entrypoint per function, each with its own import map — which is
      # what teaches Deno that `@supabase/supabase-js` is a dependency rather
      # than a bare specifier. `_shared` is checked through both of them.
      #
      # `--no-lock` because a lockfile left in a function directory is one the
      # Supabase bundler picks up: writing them once took the deployed script
      # from 738 kB to 1.8 MB, which is cold-start time on every scan.
      - name: Typecheck the edge functions
        run: |
          for fn in */; do
            name="${fn%/}"
            [ -f "$name/deno.json" ] || continue
            echo "== $name"
            deno check --no-lock --config "$name/deno.json" "$name/index.ts"
          done

      # config.toml is what the deploy bundles, and nothing above reads it: the
      # typecheck loops over directories on disk, so a block naming a function
      # that no longer exists is invisible here and fatal there. Deleting
      # `functions/catalogue` without its block turned every push to main into
      # "failed to bundle function: exit status 1" — a stale entrypoint is a
      # build error, not an unused setting.
      #
      # The mirror is just as silent: a new function with no block is simply
      # never deployed, and the symptom is a 404 from an endpoint that is
      # sitting right there in the repo. So this compares both directions.
      - name: config.toml and functions/ agree
        run: |
          fail=0
          declared=$({ grep -oE '^\[functions\.[a-z0-9-]+\]' ../config.toml || true; } \
            | sed 's/^\[functions\.//;s/\]$//' | sort)
          # `_shared` is library code rather than a function, and it is the one
          # directory here with no endpoint of its own — hence the index.ts test
          # rather than a name the list has to be kept in step with.
          on_disk=$(for name in *; do
            [ -f "$name/index.ts" ] && echo "$name"
          done | sort)

          for name in $declared; do
            if ! echo "$on_disk" | grep -qx "$name"; then
              echo "::error::config.toml declares [functions.$name], but functions/$name does not exist. The deploy will fail to bundle it."
              fail=1
            fi
          done
          for name in $on_disk; do
            if ! echo "$declared" | grep -qx "$name"; then
              echo "::error::functions/$name has no [functions.$name] block in config.toml, so it is never deployed."
              fail=1
            fi
          done

          # Every path the deploy is pointed at, not just the directory name.
          for path in $(grep -E '^(entrypoint|import_map) *=' ../config.toml | sed 's/.*= *"//;s/"$//'); do
            if [ ! -e "../$path" ]; then
              echo "::error::config.toml points at $path, which does not exist."
              fail=1
            fi
          done

          if [ "$fail" -eq 0 ]; then echo "config.toml and functions/ are in sync"; fi
          exit $fail

      # The shared code that has actual tests. Sizing is the part of the cascade
      # whose mistakes are silent — a serving label read wrong does not throw,
      # it prices the wrong amount of food and writes it to a diary.
      #
      # `--allow-env` because `llm.ts` reads OPENROUTER_MODEL at module load and
      # `cascade.ts` imports it; nothing under test touches the network.
      - name: Test the shared edge-function code
        run: deno test --no-lock --allow-env --config scan-meal/deno.json _shared/
